# tqc.yaml — SB3-Contrib TQC presets (SAC-family with truncated quantiles)

Ant-v5:
  total_steps: 1000000
  buffer_size: 1000000
  batch_size: 256
  learning_starts: 10000
  gamma: 0.99
  tau: 0.005
  learning_rate: 0.0003
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto"
  top_quantiles_to_drop_per_net: 2
  target_update_interval: 1
  target_entropy: "auto"
  policy: "MlpPolicy"
  net_arch: [256, 256]
  eval_interval: 20000
  eval_episodes: 10

