# ppo.yaml — SB3-style presets (on-policy). Use VecNormalize (obs-only) on MuJoCo.
Ant-v5:
  total_steps: 1000000
  n_envs: 1
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  learning_rate: 0.0003
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy: "MlpPolicy"
  net_arch: {pi: [256,256], vf: [256,256]}
  normalize_obs: true
  normalize_reward: false
  eval_interval: 20000
  eval_episodes: 10

