# =============================================================================
# Key Differences from Deterministic DistRL
# =============================================================================

# 1. Automatic entropy tuning (SAC-style alpha):
#    - Target entropy is automatically set based on action space
#    - For Box spaces: -action_dim
#    - For Discrete spaces: 0.98 * log(num_actions)
#
# 2. No explicit exploration noise:
#    - Stochastic policy naturally explores
#    - No need for expl_sigma, noise_type parameters
#
# 3. Gumbel-Softmax for discrete actions:
#    - Enables differentiable sampling in discrete spaces
#    - Temperature (tau) defaults to 1.0
#
# 4. No RTG toggle:
#    - Always uses n-step returns (not RTG)
#    - Simpler and more stable for stochastic policies
#
# 5. No dynamic_beta:
#    - Entropy regularization handles exploration-exploitation
#    - Beta parameter not used

# =============================================================================
# Parameter Notes
# =============================================================================

# K (n-step horizon):
#   - Range: [4, 8, 16, 32]
#   - Lower K: simpler tasks, faster credit assignment
#   - Higher K: complex tasks, long-term dependencies
#
# v_gamma (distance metric shape):
#   - Range: [0.5, 1.0, 1.5, 2.0]
#   - Lower gamma: smoother metric, better for locomotion
#   - Higher gamma: sharper metric, better for manipulation
#
# batch_size:
#   - Range: [64, 128, 256, 512]
#   - Match to environment complexity
#
# comp_samples:
#   - Range: [1024, 2048, 4096, 8192]
#   - More samples = better neighbors but slower
#
# learning_rate:
#   - Range: [3e-5, 1e-4, 3e-4, 1e-3]
#   - 3e-4 is a good default for most tasks

# =============================================================================
# Default Configuration
# =============================================================================

default:
  total_steps: 1000000
  buffer_size: 500000
  K: 16
  v_gamma: 1.0
  hidden_size: 256
  lr: 0.0003
  batch_size: 256
  comp_samples: 4096
  update_epochs_policy: 1
  update_epochs_val: 1
  policy_training_start: 10000
  val_training_start: 10000
  eval_episodes: 10
  eval_freq: 20000
  discount: 0.99
  tau: 0.005
