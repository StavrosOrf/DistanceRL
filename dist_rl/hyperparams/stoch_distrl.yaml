# Stochastic DistRL Hyperparameters for Various Environments
# This file contains tuned hyperparameters for the Stochastic Distance-based RL agent
# Unlike the deterministic version, this uses entropy regularization (SAC-style)

# =============================================================================
# Classic Control Environments
# =============================================================================

Pendulum-v1:
  # Environment settings
  total_steps: 200000
  buffer_size: 300000
  
  # Distance learning settings
  K: 16                           # n-step for recursive distance learning
  v_gamma: 1.0                    # gamma shape parameter for distance metric
  
  # Network architecture
  hidden_size: 256
  lr: 0.0003
  
  # Training settings
  batch_size: 256
  comp_samples: 4096              # comparison samples for policy training
  update_epochs_policy: 1
  update_epochs_val: 1
  
  # Training schedule
  policy_training_start: 10000
  val_training_start: 10000
  
  # Evaluation
  eval_episodes: 5
  eval_freq: 10000
  
  # Advanced settings
  discount: 0.99
  tau: 0.005                      # target network update rate

