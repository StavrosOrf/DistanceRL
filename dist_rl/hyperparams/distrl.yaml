# DistRL Hyperparameters for Various Environments
# This file contains tuned hyperparameters for the Distance-based RL agent

# =============================================================================
# Classic Control Environments
# =============================================================================

Pendulum-v1:
  # Environment settings
  total_steps: 200000
  buffer_size: 300000
  K: 16                           # n-step for recursive distance learning
  v_gamma: 1.0                    # gamma shape parameter for distance metric
  hidden_size: 256
  lr: 0.0003
  
  # Training settings
  batch_size: 256
  comp_samples: 4096              # comparison samples for policy training
  update_epochs_policy: 1
  update_epochs_val: 1
  
  # Training schedule
  policy_training_start: 10000
  val_training_start: 10000
  
  # Exploration
  expl_sigma: 0.3                 # initial exploration noise
  noise_type: "ornstein-uhlenbeck"
  
  # Evaluation
  eval_episodes: 5
  eval_freq: 10000
  
  # Return configuration
  rtg_enabled: true               # use reward-to-go instead of n-step returns
  
  # Advanced settings
  dynamic_beta: false
  beta: 5.0
  discount: 0.99
  tau: 0.005                      # target network update rate

MountainCarContinuous-v0:
  total_steps: 200_000
  buffer_size: 200_000
  K: 128 # 128 >
  v_gamma: 2
  hidden_size: 256
  lr: 0.0002
  batch_size: 256
  comp_samples: 4096
  update_epochs_policy: 1
  update_epochs_val: 1
  policy_training_start: 10000
  val_training_start: 10000
  expl_sigma: 0.5 # Very important! 
  noise_type: "OU"
  eval_episodes: 5
  eval_freq: 5000
  rtg_enabled: False
  discount: 0.99
  tau: 0.005

LunarLanderContinuous-v3:
  total_steps: 500_000
  buffer_size: 300_000
  K: 128
  v_gamma: 2
  hidden_size: 256
  lr: 0.0002
  batch_size: 256
  comp_samples: 4096
  update_epochs_policy: 1
  update_epochs_val: 1
  policy_training_start: 10000
  val_training_start: 10000
  expl_sigma: 0.3 
  noise_type: "Sched"
  eval_episodes: 10
  eval_freq: 1000
  rtg_enabled: False
  discount: 0.99
  tau: 0.005


# =============================================================================
# MuJoCo Environments (Continuous Control)
# =============================================================================

HalfCheetah-v5:    
  K: 64
  expl_sigma: 0.2
  v_gamma: 0.5
  total_steps: 1000000
  buffer_size: 1000000
  hidden_size: 256
  lr: 0.001
  batch_size: 256
  policy_training_start: 10000
  val_training_start: 10000    
  eval_episodes: 10    
  beta: 5.0
  discount: 0.99
  tau: 0.005
