# =============================================================================
# Parameter Ablation Studies
# =============================================================================

# Recommended ranges for hyperparameter tuning:
# 
# K (n-step horizon):
#   - Range: [4, 8, 16, 32]
#   - Lower K: faster tasks, simpler dynamics
#   - Higher K: long-horizon tasks, complex dependencies
#
# v_gamma (distance metric shape):
#   - Range: [0.5, 1.0, 1.5, 2.0]
#   - Lower gamma: smoother distance metric, better for continuous tasks
#   - Higher gamma: sharper distinctions, better for sparse rewards
#
# batch_size:
#   - Range: [64, 128, 256, 512]
#   - Larger batches: more stable but slower
#   - Smaller batches: faster updates but noisier
#
# comp_samples:
#   - Range: [1024, 2048, 4096, 8192]
#   - More samples: better neighbor selection but slower
#   - Fewer samples: faster but less accurate
#
# learning_rate:
#   - Range: [3e-5, 1e-4, 3e-4, 1e-3]
#   - Standard: 3e-4 works well for most tasks
#   - Adjust based on convergence speed
#
# hidden_size:
#   - Range: [64, 128, 256, 512]
#   - Larger networks: more capacity but slower
#   - Smaller networks: faster but may underfit
#
# dynamic_beta:
#   - true: adaptive weighting based on reward gaps
#   - false: fixed beta value
#   - Recommended: true for sparse rewards, false otherwise

# =============================================================================
# Default Configuration (if environment not specified)
# =============================================================================

default:
  total_steps: 1000000
